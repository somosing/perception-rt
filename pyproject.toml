[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-rt"
version = "0.3.0"
description = "Reliability-aware 3D vision for autonomous robots"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "matplotlib>=3.9,<4.0",
    "PyYAML>=6.0,<7.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=4.57,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0",
]
export = [
    "onnx==1.22.0",
    "onnxruntime-gpu==1.29.0",
    "onnxscript==0.7.1",
]

tensorrt = [
    "tensorrt-cu13==11.2.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
